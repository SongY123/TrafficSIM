components:
  schemas:
    AgentApiCreateRequest:
      additionalProperties: false
      properties:
        api_base_url:
          format: uri
          minLength: 1
          title: Api Base Url
          type: string
        credential_env_var:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Z][A-Z0-9_]*$
          title: Credential Env Var
          type: string
        description:
          default: ''
          maxLength: 1000
          title: Description
          type: string
        model_id:
          maxLength: 200
          minLength: 1
          title: Model Id
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - api_base_url
      - model_id
      - credential_env_var
      title: AgentApiCreateRequest
      type: object
    AgentApiView:
      additionalProperties: false
      properties:
        agent_api_id:
          format: uuid
          title: Agent Api Id
          type: string
        api_base_url:
          format: uri
          minLength: 1
          title: Api Base Url
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        credential_env_var:
          maxLength: 128
          minLength: 1
          title: Credential Env Var
          type: string
        description:
          default: ''
          maxLength: 1000
          title: Description
          type: string
        model_id:
          maxLength: 200
          minLength: 1
          title: Model Id
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - agent_api_id
      - workspace_id
      - name
      - api_base_url
      - model_id
      - credential_env_var
      - created_at
      - updated_at
      title: AgentApiView
      type: object
    AutomationDemand:
      additionalProperties: false
      description: Exact number of generated vehicles for one supported automation
        level.
      properties:
        level:
          enum:
          - L0
          - L1
          - L2
          - L3
          - L4
          - L5
          title: Level
          type: string
        vehicle_count:
          maximum: 100000.0
          minimum: 0.0
          title: Vehicle Count
          type: integer
      required:
      - level
      - vehicle_count
      title: AutomationDemand
      type: object
    AutomationLevel:
      enum:
      - HUMAN
      - ACC
      - L0
      - L1
      - L2
      - L3
      - L4
      - L5
      title: AutomationLevel
      type: string
    Body_import_map_api_v1_maps_import_post:
      properties:
        file:
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_import_map_api_v1_maps_import_post
      type: object
    ComponentStatus:
      enum:
      - HEALTHY
      - DEGRADED
      - UNAVAILABLE
      - DISABLED
      title: ComponentStatus
      type: string
    ExperimentCreateRequest:
      additionalProperties: false
      properties:
        configuration_id:
          anyOf:
          - pattern: ^\d{4}(?:-\d{2}){5}$
            type: string
          - type: 'null'
          title: Configuration Id
        map_id:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Map Id
        run_kind:
          $ref: '#/components/schemas/SimulationRunKind'
          default: simulation
        scenario_id:
          format: uuid
          title: Scenario Id
          type: string
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - scenario_id
      title: ExperimentCreateRequest
      type: object
    ExperimentStatus:
      enum:
      - CREATED
      - PREPARING
      - READY
      - RUNNING
      - PAUSED
      - STOPPING
      - COMPLETED
      - FAILED
      title: ExperimentStatus
      type: string
    ExperimentView:
      additionalProperties: false
      properties:
        experiment_id:
          format: uuid
          title: Experiment Id
          type: string
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
        speed_multiplier:
          exclusiveMinimum: 0.0
          title: Speed Multiplier
          type: number
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - experiment_id
      - workspace_id
      - status
      - simulation_time_ms
      - speed_multiplier
      title: ExperimentView
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        service:
          const: trafficverse-api
          default: trafficverse-api
          title: Service
          type: string
        status:
          const: ok
          default: ok
          title: Status
          type: string
      title: HealthResponse
      type: object
    MapImportJob:
      additionalProperties: false
      properties:
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        errors:
          default: []
          items:
            type: string
          title: Errors
          type: array
        job_id:
          format: uuid
          title: Job Id
          type: string
        map_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Map Id
        status:
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          title: Status
          type: string
      required:
      - job_id
      - status
      title: MapImportJob
      type: object
    MapSummary:
      additionalProperties: false
      properties:
        carla_map:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Carla Map
        carla_version:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Carla Version
        display_name:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Display Name
        files:
          default: []
          items:
            type: string
          title: Files
          type: array
        kind:
          default: core_run
          enum:
          - core_run
          - sumo
          title: Kind
          type: string
        manifest_available:
          default: true
          title: Manifest Available
          type: boolean
        map_id:
          minLength: 1
          title: Map Id
          type: string
        network_schema_version:
          minLength: 1
          title: Network Schema Version
          type: string
        sumo_begin_time_ms:
          default: 0
          minimum: 0.0
          title: Sumo Begin Time Ms
          type: integer
        sumo_config_file:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Sumo Config File
        sumo_end_time_ms:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Sumo End Time Ms
        sumo_step_ms:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Sumo Step Ms
        validated:
          title: Validated
          type: boolean
        validation_errors:
          default: []
          items:
            type: string
          title: Validation Errors
          type: array
      required:
      - map_id
      - validated
      - network_schema_version
      title: MapSummary
      type: object
    ReadinessComponent:
      additionalProperties: false
      properties:
        component:
          minLength: 1
          title: Component
          type: string
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        required:
          title: Required
          type: boolean
        status:
          $ref: '#/components/schemas/ComponentStatus'
      required:
      - component
      - status
      - required
      title: ReadinessComponent
      type: object
    ReadinessResponse:
      additionalProperties: false
      properties:
        components:
          items:
            $ref: '#/components/schemas/ReadinessComponent'
          title: Components
          type: array
        ready:
          title: Ready
          type: boolean
      required:
      - ready
      - components
      title: ReadinessResponse
      type: object
    SetSpeedRequest:
      additionalProperties: false
      properties:
        multiplier:
          exclusiveMinimum: 0.0
          maximum: 16.0
          title: Multiplier
          type: number
      required:
      - multiplier
      title: SetSpeedRequest
      type: object
    SimulationConfigurationSaveRequest:
      additionalProperties: false
      description: Named REST request for persisting a configuration-page snapshot.
      properties:
        automation_demands:
          items:
            $ref: '#/components/schemas/AutomationDemand'
          maxItems: 6
          title: Automation Demands
          type: array
        description:
          default: ''
          maxLength: 1000
          title: Description
          type: string
        duration_ms:
          exclusiveMinimum: 0.0
          title: Duration Ms
          type: integer
        map_id:
          maxLength: 200
          minLength: 1
          title: Map Id
          type: string
        scenario_id:
          format: uuid
          title: Scenario Id
          type: string
        scene_name:
          maxLength: 200
          minLength: 1
          title: Scene Name
          type: string
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - scenario_id
      - scene_name
      - map_id
      - duration_ms
      - automation_demands
      title: SimulationConfigurationSaveRequest
      type: object
    SimulationConfigurationView:
      additionalProperties: false
      description: REST view of a saved configuration snapshot.
      properties:
        configuration_id:
          pattern: ^\d{4}(?:-\d{2}){5}$
          title: Configuration Id
          type: string
        map_id:
          minLength: 1
          title: Map Id
          type: string
        map_name:
          minLength: 1
          title: Map Name
          type: string
        relative_directory:
          minLength: 1
          title: Relative Directory
          type: string
      required:
      - configuration_id
      - map_id
      - map_name
      - relative_directory
      title: SimulationConfigurationView
      type: object
    SimulationHistoryDetail:
      additionalProperties: false
      description: Detailed immutable result view for a selected formal run.
      properties:
        configured_duration_ms:
          minimum: 0.0
          title: Configured Duration Ms
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        ended_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Ended At
        experiment_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Experiment Id
        export_available:
          default: true
          title: Export Available
          type: boolean
        map_id:
          minLength: 1
          title: Map Id
          type: string
        map_name:
          minLength: 1
          title: Map Name
          type: string
        metrics:
          items:
            $ref: '#/components/schemas/SimulationResultMetric'
          title: Metrics
          type: array
        replay_available:
          title: Replay Available
          type: boolean
        road_results:
          items:
            $ref: '#/components/schemas/SimulationRoadResult'
          title: Road Results
          type: array
        run_id:
          pattern: ^\d{4}(?:-\d{2}){5}$
          title: Run Id
          type: string
        scene_name:
          minLength: 1
          title: Scene Name
          type: string
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        status_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Reason
        trends:
          items:
            $ref: '#/components/schemas/SimulationResultTrend'
          title: Trends
          type: array
        workspace_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Workspace Id
      required:
      - run_id
      - status
      - created_at
      - scene_name
      - map_id
      - map_name
      - configured_duration_ms
      - simulation_time_ms
      - replay_available
      - metrics
      - trends
      - road_results
      title: SimulationHistoryDetail
      type: object
    SimulationHistorySummary:
      additionalProperties: false
      description: One formal run discovered below the configured simulation artifact
        root.
      properties:
        configured_duration_ms:
          minimum: 0.0
          title: Configured Duration Ms
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        ended_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Ended At
        experiment_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Experiment Id
        export_available:
          default: true
          title: Export Available
          type: boolean
        map_id:
          minLength: 1
          title: Map Id
          type: string
        map_name:
          minLength: 1
          title: Map Name
          type: string
        replay_available:
          title: Replay Available
          type: boolean
        run_id:
          pattern: ^\d{4}(?:-\d{2}){5}$
          title: Run Id
          type: string
        scene_name:
          minLength: 1
          title: Scene Name
          type: string
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        status_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Reason
        workspace_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Workspace Id
      required:
      - run_id
      - status
      - created_at
      - scene_name
      - map_id
      - map_name
      - configured_duration_ms
      - simulation_time_ms
      - replay_available
      title: SimulationHistorySummary
      type: object
    SimulationReplayFrame:
      additionalProperties: false
      description: One reconstructed authoritative state used by read-only playback.
      properties:
        collision_vehicle_ids:
          default: []
          items:
            type: string
          title: Collision Vehicle Ids
          type: array
        sequence:
          minimum: 0.0
          title: Sequence
          type: integer
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
        traffic_lights:
          default: []
          items:
            $ref: '#/components/schemas/TrafficLightState'
          title: Traffic Lights
          type: array
        vehicles:
          default: []
          items:
            $ref: '#/components/schemas/VehicleState'
          title: Vehicles
          type: array
      required:
      - simulation_time_ms
      - sequence
      title: SimulationReplayFrame
      type: object
    SimulationReplayWindow:
      additionalProperties: false
      description: Bounded replay page; callers continue from ``next_time_ms`` when
        present.
      properties:
        frames:
          items:
            $ref: '#/components/schemas/SimulationReplayFrame'
          title: Frames
          type: array
        next_time_ms:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Next Time Ms
        run_id:
          pattern: ^\d{4}(?:-\d{2}){5}$
          title: Run Id
          type: string
      required:
      - run_id
      - frames
      title: SimulationReplayWindow
      type: object
    SimulationResultMetric:
      additionalProperties: false
      description: One aggregate value calculated from an explicit SUMO result field.
      properties:
        key:
          enum:
          - vehicle_total
          - completed_total
          - average_speed_mps
          - average_travel_time_s
          - average_waiting_time_s
          - average_queue_length_veh
          - maximum_queue_length_veh
          title: Key
          type: string
        label:
          minLength: 1
          title: Label
          type: string
        source:
          minLength: 1
          title: Source
          type: string
        unit:
          minLength: 1
          title: Unit
          type: string
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
      required:
      - key
      - label
      - unit
      - source
      title: SimulationResultMetric
      type: object
    SimulationResultTrend:
      additionalProperties: false
      description: A time-aligned SUMO summary series.
      properties:
        key:
          enum:
          - vehicle_count
          - average_speed_mps
          - queue_length_veh
          - average_waiting_time_s
          - completed_total
          title: Key
          type: string
        label:
          minLength: 1
          title: Label
          type: string
        samples:
          items:
            $ref: '#/components/schemas/SimulationTrendSample'
          title: Samples
          type: array
        unit:
          minLength: 1
          title: Unit
          type: string
      required:
      - key
      - label
      - unit
      - samples
      title: SimulationResultTrend
      type: object
    SimulationRoadResult:
      additionalProperties: false
      description: Aggregate values for one SUMO edge in the run's actual network.
      properties:
        average_speed_mps:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Average Speed Mps
        congestion_ratio:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Congestion Ratio
        edge_id:
          minLength: 1
          title: Edge Id
          type: string
        queue_length_m:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Queue Length M
        traffic_flow_veh_per_hour:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Traffic Flow Veh Per Hour
      required:
      - edge_id
      title: SimulationRoadResult
      type: object
    SimulationRunKind:
      enum:
      - simulation
      - test
      title: SimulationRunKind
      type: string
    SimulationTrendSample:
      additionalProperties: false
      properties:
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
        value:
          title: Value
          type: number
      required:
      - simulation_time_ms
      - value
      title: SimulationTrendSample
      type: object
    StopExperimentRequest:
      additionalProperties: false
      properties:
        reason:
          default: USER_REQUEST
          maxLength: 100
          minLength: 1
          title: Reason
          type: string
      title: StopExperimentRequest
      type: object
    TrafficLightState:
      additionalProperties: false
      properties:
        phase:
          minLength: 1
          title: Phase
          type: string
        remaining_ms:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Remaining Ms
        signal_id:
          minLength: 1
          title: Signal Id
          type: string
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
      required:
      - signal_id
      - simulation_time_ms
      - phase
      title: TrafficLightState
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    Vector3:
      additionalProperties: false
      properties:
        x:
          title: X
          type: number
        y:
          title: Y
          type: number
        z:
          default: 0.0
          title: Z
          type: number
      required:
      - x
      - y
      title: Vector3
      type: object
    VehicleAction:
      enum:
      - KEEP_LANE
      - ACCELERATE
      - BRAKE
      - LANE_CHANGE_LEFT
      - LANE_CHANGE_RIGHT
      - STOP
      - TAKEOVER
      title: VehicleAction
      type: string
    VehicleState:
      additionalProperties: false
      properties:
        acceleration_mps2:
          title: Acceleration Mps2
          type: number
        action:
          $ref: '#/components/schemas/VehicleAction'
        automation_level:
          $ref: '#/components/schemas/AutomationLevel'
        controller_id:
          minLength: 1
          title: Controller Id
          type: string
        experiment_id:
          format: uuid
          title: Experiment Id
          type: string
        heading_rad:
          title: Heading Rad
          type: number
        lane_id:
          minLength: 1
          title: Lane Id
          type: string
        position:
          $ref: '#/components/schemas/Vector3'
        risk_score:
          maximum: 1.0
          minimum: 0.0
          title: Risk Score
          type: number
        route_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Route Id
        schema_version:
          const: '1.0'
          default: '1.0'
          title: Schema Version
          type: string
        sequence:
          minimum: 0.0
          title: Sequence
          type: integer
        simulation_time_ms:
          minimum: 0.0
          title: Simulation Time Ms
          type: integer
        speed_mps:
          minimum: 0.0
          title: Speed Mps
          type: number
        target_lane_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Lane Id
        vehicle_id:
          minLength: 1
          title: Vehicle Id
          type: string
      required:
      - experiment_id
      - vehicle_id
      - simulation_time_ms
      - sequence
      - automation_level
      - position
      - speed_mps
      - acceleration_mps2
      - heading_rad
      - lane_id
      - controller_id
      - action
      - risk_score
      title: VehicleState
      type: object
    WorkspaceActivitySample:
      additionalProperties: false
      properties:
        day:
          format: date
          title: Day
          type: string
        simulations:
          minimum: 0.0
          title: Simulations
          type: integer
      required:
      - day
      - simulations
      title: WorkspaceActivitySample
      type: object
    WorkspaceAutomationCount:
      additionalProperties: false
      properties:
        count:
          minimum: 0.0
          title: Count
          type: integer
        level:
          maxLength: 40
          minLength: 1
          title: Level
          type: string
      required:
      - level
      - count
      title: WorkspaceAutomationCount
      type: object
    WorkspaceCreateRequest:
      additionalProperties: false
      properties:
        description:
          default: ''
          maxLength: 1000
          title: Description
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: WorkspaceCreateRequest
      type: object
    WorkspaceOverview:
      additionalProperties: false
      description: Mock-backed workspace overview kept stable for a future real data
        source.
      properties:
        activity:
          items:
            $ref: '#/components/schemas/WorkspaceActivitySample'
          title: Activity
          type: array
        agent_count:
          minimum: 0.0
          title: Agent Count
          type: integer
        automation_counts:
          items:
            $ref: '#/components/schemas/WorkspaceAutomationCount'
          title: Automation Counts
          type: array
        failed_simulations:
          minimum: 0.0
          title: Failed Simulations
          type: integer
        map_count:
          minimum: 0.0
          title: Map Count
          type: integer
        preview_region:
          maxLength: 200
          minLength: 1
          title: Preview Region
          type: string
        recent_simulations:
          items:
            $ref: '#/components/schemas/WorkspaceRecentSimulation'
          title: Recent Simulations
          type: array
        runtime_hours:
          minimum: 0.0
          title: Runtime Hours
          type: number
        scenario_count:
          minimum: 0.0
          title: Scenario Count
          type: integer
        simulation_count:
          minimum: 0.0
          title: Simulation Count
          type: integer
        succeeded_simulations:
          minimum: 0.0
          title: Succeeded Simulations
          type: integer
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - map_count
      - agent_count
      - scenario_count
      - simulation_count
      - automation_counts
      - succeeded_simulations
      - failed_simulations
      - runtime_hours
      - activity
      - recent_simulations
      - preview_region
      title: WorkspaceOverview
      type: object
    WorkspaceRecentSimulation:
      additionalProperties: false
      properties:
        automation_summary:
          maxLength: 100
          minLength: 1
          title: Automation Summary
          type: string
        duration_ms:
          minimum: 0.0
          title: Duration Ms
          type: integer
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        status:
          enum:
          - SUCCEEDED
          - WARNING
          - FAILED
          title: Status
          type: string
      required:
      - name
      - status
      - occurred_at
      - duration_ms
      - automation_summary
      title: WorkspaceRecentSimulation
      type: object
    WorkspaceUpdateRequest:
      additionalProperties: false
      properties:
        description:
          default: ''
          maxLength: 1000
          title: Description
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: WorkspaceUpdateRequest
      type: object
    WorkspaceView:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          default: ''
          maxLength: 1000
          title: Description
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - name
      - created_at
      - updated_at
      title: WorkspaceView
      type: object
