<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TrafficVerse 全局二维地图</title>
    <link rel="stylesheet" href="bundle/maplibre-gl.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="map"></div>
    <div id="map-grid" aria-hidden="true"></div>
    <section id="map-hud" aria-label="地图状态">
      <div class="map-eyebrow">TOWN04 数字孪生</div>
      <div class="map-title">全局交通态势</div>
      <div id="map-status">正在加载离线地图组件……</div>
      <div class="map-legend">
        <span><i class="legend-dot human"></i>人工驾驶</span>
        <span><i class="legend-dot automated"></i>自动驾驶</span>
        <span><i class="legend-dot signal"></i>交通信号</span>
      </div>
    </section>
    <section id="replay-legend" aria-label="道路表现图例">
      <strong>图例</strong>
      <span><i class="replay-dot free"></i>畅通</span>
      <span><i class="replay-dot fast"></i>较快</span>
      <span><i class="replay-dot normal"></i>一般</span>
      <span><i class="replay-dot slow"></i>缓行</span>
      <span><i class="replay-dot congested"></i>拥堵</span>
    </section>
    <div id="view-controls" aria-label="地图视角">
      <button type="button" data-view-mode="2d" class="active">2D</button>
      <button type="button" data-view-mode="3d">3D</button>
      <button type="button" id="reset-view">复位</button>
    </div>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="bundle/map.js"></script>
  </body>
</html>
