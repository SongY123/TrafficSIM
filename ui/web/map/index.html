<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TrafficVerse 全局二维地图</title>
    <link rel="stylesheet" href="bundle/maplibre-gl.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="map"></div>
    <div id="map-grid" aria-hidden="true"></div>
    <section id="map-hud" aria-label="地图图例">
      <div class="map-legend">
        <span class="legend-item"><i class="legend-icon l0" aria-hidden="true"></i>L0</span>
        <span class="legend-item"><i class="legend-icon l1" aria-hidden="true"></i>L1</span>
        <span class="legend-item"><i class="legend-icon l2" aria-hidden="true"></i>L2</span>
        <span class="legend-item"><i class="legend-icon l3" aria-hidden="true"></i>L3</span>
        <span class="legend-item"><i class="legend-icon l4" aria-hidden="true"></i>L4</span>
        <span class="legend-item"><i class="legend-icon l5" aria-hidden="true"></i>L5</span>
        <span class="legend-item"><i class="legend-icon emergency" aria-hidden="true"></i>救护车</span>
        <span class="legend-item"><i class="legend-icon obstacle" aria-hidden="true"></i>障碍物</span>
        <span class="legend-item"><i class="legend-icon signal" aria-hidden="true"></i>交通信号</span>
      </div>
    </section>
    <output id="map-status" hidden aria-live="polite"></output>
    <div id="view-controls" aria-label="地图操作">
      <button type="button" id="reset-view">复位</button>
    </div>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="bundle/map.js"></script>
  </body>
</html>
