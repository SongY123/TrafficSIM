schema_version: "2.0"
default_profile: auto
profiles:
  macos-dev:
    operating_system: Darwin
    architectures:
      - arm64
      - x86_64
    python_version: "3.10"
    sumo:
      mode: required
      version: "1.27.1"
    postgres:
      mode: disabled
      version: "16"
  core-run:
    operating_system: Linux
    architectures:
      - x86_64
    python_version: "3.10"
    sumo:
      mode: required
      version: "1.27.1"
    postgres:
      mode: optional
      version: "16"
